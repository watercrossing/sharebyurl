[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sharebyurl"
dynamic = ["version"]
description = "Publish local files as unguessable links through your webserver"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ingolf Becker", email = "ingolf.becker@googlemail.com" }]
keywords = ["cli", "workflow", "file sharing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "argcomplete>=3.0",
    "python-slugify>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/watercrossing/sharebyurl"
Source = "https://github.com/watercrossing/sharebyurl"
Issues = "https://github.com/watercrossing/sharebyurl/issues"

[project.scripts]
sharebyurl = "sharebyurl.main:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "sharebyurl.__version__" }

[tool.setuptools.packages.find]
include = ["sharebyurl*"]
exclude = ["sharebyurl.tests*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["sharebyurl/tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["argcomplete.*", "slugify.*"]
ignore_missing_imports = true
